<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Upstream Field-to-Finance Maturity Diagnostic | Weaver</title>
<style>
:root{
  /* Weaver Visual Identity, Oct 2024 style sheet */
  --ink:#000000;            /* Black */
  --ink-soft:#424142;       /* Dark Gray, 90% K */
  --steel:#7A7A7A;          /* derived mid-gray, not an official swatch: interpolated
                                between Dark Gray and Light Gray for a third text tier */
  --rule:#E6E6E6;           /* Light Gray, 10% K */
  --paper:#FAFAFA;          /* near-white, off-palette: subtle page/panel separation only */
  --panel:#FFFFFF;
  --brand:#3E6C57;          /* Weaver Dark Green, primary */
  --brand-hover:#335A49;    /* derived: Dark Green stepped down ~15% for hover/active */
  --strong:#6FBE65;         /* Weaver Light Green, secondary: positive / at-target */
  --info:#00569D;           /* Dark Blue, secondary: structural / informational */
  --target:#FAAF4D;         /* Light Orange, secondary: target marker */
  --gap:#F05B33;            /* Dark Orange, secondary: alert / below target */
  --gap-soft:#FDE8E0;       /* derived light tint of Dark Orange for alert backgrounds */
  --shadow:0 1px 0 rgba(0,0,0,.06), 0 12px 32px -20px rgba(0,0,0,.35);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --body:"Proxima Nova",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --display:var(--body);    /* Weaver's exhibit-display face IS Proxima Nova, no separate serif */
  --firm:Ebrima,var(--body);/* Weaver's firm-document face, used nowhere in this booth build */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px}

.app{min-height:100%;display:flex;flex-direction:column;max-width:900px;margin:0 auto;padding:0 24px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0 16px;border-bottom:1px solid var(--rule)}
.brandmark{display:flex;flex-direction:column;gap:2px;line-height:1.15;align-items:flex-start}
.brandmark .brandlogo{height:28px;width:auto;max-width:none;display:block;align-self:flex-start;object-fit:contain}
.brandmark .prodname{font-family:var(--body);color:var(--steel);font-weight:500;font-size:12px;letter-spacing:.01em}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel)}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 0 40px;animation:rise .26s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.stage{animation:none}}

.spine{display:flex;gap:5px;padding:14px 0 0}
.spine i{flex:1;height:4px;background:var(--rule);border-radius:2px;transition:background .3s ease,transform .3s ease}
.spine i.done{background:var(--ink)}
.spine i.now{background:var(--brand);transform:scaleY(1.4)}

h1{font-family:var(--display);font-size:clamp(28px,5.2vw,42px);line-height:1.1;letter-spacing:-.01em;margin:.2em 0 .35em;font-weight:700}
h2{font-family:var(--display);font-size:clamp(22px,3.6vw,28px);line-height:1.18;letter-spacing:-.005em;margin:0 0 .5em;font-weight:700}
h3{font-size:14px;margin:0 0 10px;font-weight:650;letter-spacing:.01em;text-transform:uppercase;color:var(--steel)}
p{margin:0 0 16px;color:var(--ink-soft);max-width:62ch}
.lede{font-size:19px;color:var(--ink-soft)}
.disclaimer{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--steel);margin:0 0 18px;padding-bottom:14px;border-bottom:1px solid var(--rule)}

.qhead{margin-bottom:22px}
.qmeta{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.code{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--brand);border:1px solid var(--rule);padding:3px 7px;border-radius:3px}
.qprompt{font-family:var(--display);font-size:clamp(21px,3.4vw,27px);line-height:1.28;letter-spacing:-.005em;font-weight:700;margin:0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:start;text-align:left;
  background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:17px 19px;
  box-shadow:var(--shadow);transition:border-color .15s,transform .1s,background-color .15s;
  min-height:58px;width:100%;
}
.opt:hover{border-color:var(--steel)}
.opt:active{transform:scale(.99)}
.opt[aria-pressed="true"]{border-color:var(--brand);background:#EBF5EC;box-shadow:inset 0 0 0 1px var(--brand),var(--shadow)}
.lvl{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--brand);line-height:1.3;padding-top:1px}
.opt[aria-pressed="true"] .lvl{color:var(--ink)}
.olabel{font-weight:700;font-size:17.5px;letter-spacing:-.005em;display:block}
.otext{font-size:13.5px;color:var(--ink-soft);margin-top:5px;line-height:1.42;font-weight:400}
.opt.plain{grid-template-columns:1fr}
.opt.na .lvl{font-size:12px;letter-spacing:.08em;padding-top:5px}

.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:26px}
.btn{background:var(--brand);color:#fff;border:1px solid var(--brand);border-radius:8px;padding:15px 26px;
  font-weight:650;letter-spacing:-.01em;font-size:16px;min-height:50px}
.btn:hover{background:var(--brand-hover)}
.btn.ghost{background:transparent;color:var(--ink-soft);border-color:var(--rule)}
.btn.ghost:hover{background:#F2F2F2;color:var(--ink)}
.btn.small{padding:10px 18px;font-size:14px;min-height:auto}
.back{background:var(--panel);border:1px solid var(--rule);border-radius:8px;color:var(--ink-soft);font-size:15px;
  padding:12px 20px;min-height:48px;width:100%;text-align:left;margin-top:4px;display:flex;align-items:center;gap:8px}
.back:hover{border-color:var(--steel);background:#F2EFE8}
.back:before{content:"\2190";font-size:15px}

/* rebuilt hero result */
.hero{margin-bottom:8px}
.hero .state{font-family:var(--display);font-size:clamp(24px,4.4vw,34px);font-weight:700;letter-spacing:-.01em;margin:0 0 .3em}
.hero .sub{font-size:16.5px;color:var(--ink-soft);margin-bottom:18px}
.gapcard{border:1px solid var(--gap);background:var(--gap-soft);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.gapcard.ok{border-color:var(--strong);background:#EAF7EA}
.gapcard .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);margin-bottom:6px}
.gapcard.ok .k{color:var(--ink)}
.gapcard .v{font-weight:700;font-size:18px;letter-spacing:-.005em}
.gapcard .statusline{font-size:13.5px;color:var(--ink-soft);margin-top:5px;line-height:1.5}
.gapcard .statusline b{color:var(--ink);font-weight:650}
.gapcard .statusline.headline{font-weight:650;color:var(--gap);margin-top:8px}
.patterncard{border:1px solid var(--brand);border-radius:10px;padding:20px 22px;background:var(--panel);box-shadow:var(--shadow);margin-bottom:14px}
.patterncard .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);margin-bottom:8px}
.patterncard h2{margin-bottom:.35em}
.patterncard p{margin:0;color:var(--ink-soft)}
.scoreline{font-family:var(--mono);font-size:13px;color:var(--steel);margin-top:6px}

.chainwrap{margin:6px 0}

/* small, result-specific relationship visual (replaces the full enterprise diagram) */
.opplede{font-size:14px;color:var(--ink-soft);margin-bottom:14px}
.ochain-wrap{margin:0 0 22px}
.omap{width:100%;height:auto;display:block}
.mapbox{fill:var(--panel);stroke:var(--rule);stroke-width:1.5}
.mapbox.hit{stroke:var(--gap);stroke-width:2;fill:var(--gap-soft)}
.mapboxlabel{font:600 11px var(--body);fill:var(--ink-soft)}
.mapboxlabel.hit{fill:var(--ink);font-weight:700}
.mapline{stroke:var(--rule);stroke-width:1.5}
.mapline.hit{stroke:var(--gap);stroke-width:2.5}
.ochain-foundation{margin-top:6px;padding-top:5px;border-top:2px solid var(--info);font-size:10.5px;
  color:var(--info);font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase}
.ochain-mna{margin-bottom:6px;padding-bottom:5px;border-bottom:2px dashed var(--gap);font-size:10.5px;
  color:var(--gap);font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;text-align:center}
.ochain-cross{margin-bottom:6px;padding-bottom:5px;border-bottom:2px dashed var(--info);font-size:10.5px;
  color:var(--info);font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;text-align:center}
.miniflow{display:flex;flex-direction:column;align-items:center;gap:2px;margin:10px 0 16px}
.miniflow.branch,.miniflow.converge{flex-direction:row;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.mnode{border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:12px 22px;
  font-weight:650;font-size:15px;box-shadow:var(--shadow);text-align:center}
.mnode.hit{border-color:var(--gap);color:var(--gap)}
.mnode.src{border-color:var(--strong)}
.marrow{font-size:20px;color:var(--gap);display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1;margin:2px 0}
.mtag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gap);
  background:var(--gap-soft);padding:3px 8px;border-radius:4px;margin-top:2px}
.mbranches,.mconverge-srcs{display:flex;flex-direction:column;gap:9px}
.mbranch{font-weight:600;font-size:14px;color:var(--ink-soft)}
.oppnote{border:1px solid var(--gap);background:var(--gap-soft);border-radius:8px;padding:14px 16px}
.oppnote.plain{border-color:var(--rule);background:var(--paper)}
.oppnote .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gap);margin-bottom:6px}
.oppnote.plain .k{color:var(--ink);font-weight:700;font-family:var(--body);text-transform:none;letter-spacing:0;font-size:15.5px}
.oppnote p{margin:0;font-size:14px;color:var(--ink-soft)}
.oppnote p b{color:var(--ink)}

.heat{display:flex;flex-direction:column;gap:6px;margin:14px 0 4px}
.readme{font-size:13.5px;color:var(--ink-soft);margin-bottom:14px}

/* capability quick-view heatmap */
.capheat{margin:22px 0 4px}
.capheat-row{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}
.capheat-tile{width:74px;text-align:center}
.chswatch{width:100%;height:40px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:700;font-size:16px;color:#fff}
.capheat-tile.below-major .chswatch{background:var(--gap);color:var(--ink)}
.capheat-tile.below-minor .chswatch{background:var(--target);color:var(--ink)}
.capheat-tile.at .chswatch{background:var(--strong);color:var(--ink)}
.capheat-tile.above .chswatch{background:var(--info)}
.chlabel{font-size:10.5px;color:var(--ink-soft);margin-top:5px;line-height:1.25;word-break:break-word}
.capheat-legend-line{font-size:12px;color:var(--ink-soft);margin:6px 0 0}
.row{border-radius:6px}
.row.below{background:#FDF0EA;padding:14px 14px;margin-bottom:2px}
.row.at,.row.above{display:flex;align-items:center;gap:10px;padding:7px 10px;font-size:13px;color:var(--ink-soft)}
.row.above{color:var(--brand)}
.row .rowhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.row.below .nm{font-weight:650;font-size:15px;color:var(--ink)}
.row.below .lvlname{font-size:13px;color:var(--gap);font-weight:650;white-space:nowrap}
.row.at .nm,.row.above .nm{flex:1;font-size:13px}
.row.at .lvlname,.row.above .lvlname{font-size:12.5px;white-space:nowrap}
.row.at .statusinline{margin-left:auto;font-size:12px;white-space:nowrap}
.row.above .statusinline{margin-left:auto;font-size:12px;white-space:nowrap;font-weight:650}
.bar{height:9px;background:#EDE9E0;border-radius:5px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--gap);border-radius:5px}
.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--target)}
.row.below .status{font-size:13px;color:var(--ink-soft);font-weight:600;margin-top:8px}
.row.below .status .tgt{color:var(--steel);font-weight:500}
.legend{font-size:12px;color:var(--ink-soft);margin-top:12px;display:flex;gap:16px;flex-wrap:wrap}
.legend b{font-weight:500;display:inline-flex;align-items:center;gap:6px}
.swatch{width:11px;height:4px;border-radius:2px;display:inline-block}

.quietlink{background:none;border:0;color:var(--steel);font-size:13.5px;text-decoration:underline;
  text-underline-offset:3px;padding:8px 2px;display:inline-block}
.quietlink:hover{color:var(--ink)}
.fwdnav{margin-top:22px;padding-top:16px;border-top:1px solid var(--rule)}
.fwdnav button{background:none;border:0;color:var(--brand);font-weight:650;font-size:14.5px;padding:6px 0}
.fwdnav button:hover{text-decoration:underline}

.actionlist{list-style:none;padding:0;margin:0}
.actionlist li{border-top:1px solid var(--rule);padding:14px 0;display:grid;grid-template-columns:80px 1fr;gap:14px}
.actionlist .when{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);padding-top:3px}
.actionlist .what{font-size:15.5px;line-height:1.4}

.pulse{border-top:1px solid var(--rule);margin-top:22px;padding-top:16px;font-size:14.5px;color:var(--ink-soft)}
.bridge{border:1px solid var(--rule);border-radius:10px;padding:18px 20px;background:var(--panel);margin-top:22px}
.bridge .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);margin-bottom:8px}
.bridge p{margin:0;font-size:14.5px}

.field{margin-bottom:14px}
form{margin:0}
.field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;font-weight:500}
.field input{width:100%;padding:14px 15px;font:inherit;border:1px solid var(--rule);border-radius:8px;background:var(--panel);color:var(--ink)}
.field input:focus{border-color:var(--ink);outline:none;box-shadow:inset 0 0 0 1px var(--ink)}
.consent{font-size:13px;color:var(--steel);margin:14px 0 0;max-width:58ch}
.err{color:var(--gap);font-size:14px;margin-top:10px;min-height:20px}

.footer{border-top:1px solid var(--rule);padding:14px 0 26px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:var(--steel)}
.footer button{background:none;border:0;color:var(--steel);font-size:12px;text-decoration:underline;text-underline-offset:3px;padding:4px}

.tabstrip{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--rule);overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{flex:0 0 auto;background:transparent;border:0;padding:11px 15px 12px;font-size:13.5px;font-weight:650;
  color:var(--ink-soft);border-bottom:3px solid transparent;white-space:nowrap;letter-spacing:.01em;transition:color .15s,border-color .15s}
.tab.active{color:var(--ink);border-bottom-color:var(--brand)}
.tabpanel{display:none}
.tabpanel.active{display:block;animation:rise .22s ease both}

.admin table{width:100%;border-collapse:collapse;font-size:13px;font-family:var(--mono)}
.admin th,.admin td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--rule);white-space:nowrap}
.admin th{color:var(--steel);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.warn{background:#FDF0EA;border:1px solid var(--gap);border-radius:8px;padding:12px 14px;font-size:14px;color:var(--ink-soft);margin:14px 0}

@media print{
  .tabstrip,.footer,#resetBtn,#adminBtn,.spine,.fwdnav,.quietlink{display:none !important}
  .stage{display:block;padding:0}
  .tabpanel{display:block !important;break-inside:auto;margin-bottom:26px}
  .patterncard,.hero,.gapcard,.chainsvg,.row,.actionlist li,.bridge{break-inside:avoid}
  body{background:#fff}
  /* Isolate a report preview shown inline in the admin Reports view onto one
     clean US Letter page. The primary Print/Save PDF path (printReport())
     opens its own standalone document with the same rule, so this is a
     defensive fallback for a plain browser Ctrl+P. */
  .topbar,.admin>.actions,#repdetail>.actions{display:none !important}
  .reportdoc{display:block !important;max-width:none !important;width:7.5in;margin:0 auto}
  @page{size:letter;margin:0.5in}
}
</style>
</head>

const KEY='wvr_ff_responses_v1', IKEY='wvr_ff_instance', DRAFT_KEY='wvr_ff_draft', ADMIN_PIN='4471';
let memStore=[], storageOK=true;
function readAll(){
  try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):[];}
  catch(e){storageOK=false;return memStore;}
}
function saveOne(rec){
  const all=readAll();all.push(rec);
  try{localStorage.setItem(KEY,JSON.stringify(all));}
  catch(e){storageOK=false;memStore=all;}
  return all.length;
}
function instanceId(){
  try{
    let i=localStorage.getItem(IKEY);
    if(!i){i='booth-'+Math.random().toString(36).slice(2,7);localStorage.setItem(IKEY,i);}
    return i;
  }catch(e){return 'booth-mem';}

// Kept entirely separate from wvr_ff_responses_v1 (the booth's own record of
// what was said, exported wholesale by the JSON button). write_token and
// server_id never appear in that store and never appear in CSV/JSON export.
const SYNC_KEY='wvr_ff_sync_v1';
let memSync=[];
function readSync(){
  try{const r=localStorage.getItem(SYNC_KEY);return r?JSON.parse(r):[];}
  catch(e){return memSync;}
}
function writeSync(all){
  try{localStorage.setItem(SYNC_KEY,JSON.stringify(all));}catch(e){memSync=all;}
}
function getSync(responseId){return readSync().find(r=>r.response_id===responseId)||null;}
function upsertSync(responseId,patch){
  const all=readSync();
  const i=all.findIndex(r=>r.response_id===responseId);
  const base=i>=0?all[i]:{response_id:responseId,write_token:null,server_id:null,
    sync_status:'local_only',last_sync_error:null,pending_completion:null};
  const next=Object.assign({},base,patch);
  if(i>=0)all[i]=next; else all.push(next);
  writeSync(all);
  return next;
}

// --- Response identity ----------------------------------------------------
// response_id + write_token are generated together, client-side, the moment
// a respondent session actually begins (role selection) - never on page
// load, never inside fresh(), which also runs at module init and on the
// welcome screen. Next person/Different role each get a fresh pair; draft
// recovery keeps the existing one (see saveDraft/readDraft below).
function b64url(bytes){
  let bin='';bytes.forEach(b=>{bin+=String.fromCharCode(b);});
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function newWriteToken(){
  const bytes=new Uint8Array(32);
  crypto.getRandomValues(bytes);
  return b64url(bytes);
}

}

// --- Client <-> Edge Function sync ----------------------------------------
// Attempt the request, handle the actual response. Never gates on
// navigator.onLine - that flag is unreliable and this codebase doesn't
// trust it for anything.
function apiCall(route,body,opts){
  opts=opts||{};
  return fetch(FUNCTIONS_URL+route,{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':CONFIG.SUPABASE_PUBLISHABLE_KEY},
    body:JSON.stringify(body),
    keepalive:!!opts.keepalive
  }).then(r=>r.json().catch(()=>null).then(json=>({httpOk:r.ok,json})))
    .catch(e=>({httpOk:false,json:{ok:false,code:'network_error',message:String(e&&e.message||e)}}));
}
// Returns a Promise<boolean>: true once the server actually has this
// record, false otherwise. Callers that need /start done first - notably
// flushPending() below, for a respondent who completed entirely offline and
// so never had a successful /start either - chain on this instead of
// assuming the row already exists.
function syncStart(responseId,opts){
  const sync=getSync(responseId);
  if(!sync||!sync.write_token)return Promise.resolve(false);
  return apiCall('/start',{
    event_id:CONTENT.meta.event_id,response_id:responseId,write_token:sync.write_token,
    instance_id:instanceId(),content_version:CONTENT.meta.version,app_version:APP_VERSION,role:S.role
  },opts).then(({httpOk,json})=>{
    if(httpOk&&json&&json.ok){
      upsertSync(responseId,{server_id:(json.data&&json.data.id)||null,sync_status:'synced',last_sync_error:null});
      return true;
    }
    upsertSync(responseId,{sync_status:'error',last_sync_error:(json&&json.message)||'start failed'});
    return false;
  });
}
let saveSyncTimer=null;
function queueSaveSync(){
  if(!S||!S.response_id)return;
  clearTimeout(saveSyncTimer);
  saveSyncTimer=setTimeout(()=>syncSave(S.response_id),600);
}
function syncSave(responseId){
  if(!responseId||!S||S.response_id!==responseId||S.saved)return; // /save is in-progress-only; completed records go through /complete
  const sync=getSync(responseId);
  if(!sync||!sync.write_token)return;
  apiCall('/save',{
    event_id:CONTENT.meta.event_id,response_id:responseId,write_token:sync.write_token,
    role:S.role,profile:S.profile,current_index:S.idx,started:S.started,
    answers:S.queue.length
      ?S.queue.map(q=>({id:q.id,capability:q.capability_id,handoff:q.handoff_id,domain:q.domain_id,
          value:(S.answers[q.id]||{}).value||null,target:targetFor(q)}))
      :Object.keys(S.answers).map(id=>({id,value:S.answers[id].value}))
  }).then(({httpOk,json})=>{
    upsertSync(responseId,httpOk&&json&&json.ok
      ?{sync_status:'synced',last_sync_error:null}
      :{sync_status:'error',last_sync_error:(json&&json.message)||'save failed'});
  });
}
function syncComplete(responseId,opts){
  const sync=getSync(responseId);
  if(!sync||!sync.write_token||!sync.pending_completion)return;
  const pc=sync.pending_completion;
  apiCall('/complete',{
    event_id:CONTENT.meta.event_id,response_id:responseId,write_token:sync.write_token,
    contact:pc.contact,result_snapshot:pc.result_snapshot
  },opts).then(({httpOk,json})=>{
    if(httpOk&&json&&json.ok){
      upsertSync(responseId,{sync_status:'synced',last_sync_error:null,pending_completion:null,
        server_id:(json.data&&json.data.id)||sync.server_id});
    }else if(httpOk&&json&&!json.ok){
      upsertSync(responseId,{sync_status:'error',last_sync_error:json.message||'complete failed'});
    }
    // network_error: leave pending_completion in place untouched, retried by the next flush.
  });
}
// Flush pending writes: startup, reconnect, tab foregrounding, and page teardown
// (keepalive, so an offline-completed record still leaves on tab close/booth
// device sleep instead of waiting for a flush that may never come).
function flushPending(){
  readSync().forEach(rec=>{
    if(!rec.write_token)return;
    if(rec.sync_status==='synced'&&!rec.pending_completion)return;
    // Whatever's still outstanding, the server needs the row to exist
    // first. A respondent who completed entirely offline never had a
    // successful /start, and /complete against a row that isn't there
    // 404s forever - so always (re)confirm /start before attempting
    // /complete or /save. /start is idempotent, so this is cheap once the
    // record is already synced.
    syncStart(rec.response_id).then(started=>{
      if(!started)return; // still unreachable; the next flush retries from here
      if(rec.pending_completion)syncComplete(rec.response_id);
      else if(S&&S.response_id===rec.response_id&&!S.saved)queueSaveSync();
    });
  });
}
function flushPendingOnTeardown(){
  readSync().forEach(rec=>{
    if(!rec.write_token)return;
    if(rec.sync_status==='synced'&&!rec.pending_completion)return;
    // Best-effort, fire-and-forget - a chained await is not reliable once
    // the page is unloading, so /start and /complete go out as two
    // concurrent keepalive requests rather than one waiting on the other.
    // If /start hasn't landed by the time /complete is processed, the
    // ordinary flushPending() retry loop (on next startup/online/
    // visibilitychange) picks it up correctly either way.
    syncStart(rec.response_id,{keepalive:true});
    if(rec.pending_completion)syncComplete(rec.response_id,{keepalive:true});
  });
}

function wrapLines(text,maxChars,maxLines){
  const words=String(text||'').split(/\s+/).filter(Boolean);
  const lines=[];let cur='';
  words.forEach(w=>{
    const t=cur?cur+' '+w:w;
    if(t.length>maxChars&&cur){lines.push(cur);cur=w;}else cur=t;
  });
  if(cur)lines.push(cur);
  if(lines.length>maxLines){
    lines.length=maxLines;
    let last=lines[maxLines-1];
    while(last.length>maxChars-1&&last.length>0)last=last.slice(0,-1);
    lines[maxLines-1]=last.replace(/\s+$/,'')+'…';

}
// Shared by the teaser and the report: one function draws every
// chain_analysis mode (connector/branch/converge/node get real box-and-line
// geometry from CHAIN; mna/cross/foundation get a labeled block; none is
// handled by the caller, not here). box:{w,h} lets each consumer size it.
function chainDiagramSVG(a,box){
  box=box||{w:460,h:170};
  const C=TEASER_COLORS;
  if(!a||a.mode==='none')return {svg:'',note:'At or above target for every assessed area.'};
  if(a.mode==='mna'||a.mode==='cross'||a.mode==='foundation'){
    const label=a.mode==='mna'?'M&A pressure across the model'
      :a.mode==='cross'?'Cross-functional across the model'
      :'Master data & integration, underneath every stage';
    const w=box.w,h=Math.min(box.h,90);
    return {svg:`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      <rect x="0" y="0" width="${w}" height="${h}" rx="10" fill="${C.gap}" opacity="0.12"/>
      <rect x="0" y="0" width="8" height="${h}" fill="${C.gap}"/>
      <text x="26" y="${Math.round(h/2+8)}" font-size="22" font-weight="700" fill="${C.ink}">${esc(label)}</text>
    </svg>`,note:null};
  }
  const boxes={};
  const nodeIds=a.mode==='node'?[a.stage]
    :a.mode==='connector'?[a.src[0],a.dst[0]]
    :a.mode==='branch'?[a.src[0],...a.dst]
    :a.mode==='converge'?[...a.src,a.dst[0]]
    :[];
  nodeIds.forEach(id=>{const c=findChainNode(id);if(c)boxes[id]={x:c.x,y:c.y,label:c.short||c.label};});
  if(!Object.keys(boxes).length)return {svg:'',note:null};
  const xs=Object.values(boxes).map(b=>b.x),ys=Object.values(boxes).map(b=>b.y);
  const pad=80;
  const minX=Math.min(...xs)-pad,maxX=Math.max(...xs)+pad,minY=Math.min(...ys)-pad,maxY=Math.max(...ys)+pad;
  const vbW=maxX-minX,vbH=maxY-minY;
  const scale=Math.min(box.w/vbW,box.h/vbH);
  const w=Math.round(vbW*scale),h=Math.round(vbH*scale);
  const boxW=150,boxH=52;
  const rects=Object.entries(boxes).map(([id,b])=>{
    const hit=a.mode==='node'?id===a.stage
      :a.mode==='connector'?id===a.dst[0]
      :a.mode==='branch'?a.dst.includes(id)
      :a.mode==='converge'?id===a.dst[0]
      :false;
    const fill=hit?C.gap:'#FFFFFF',stroke=hit?C.gap:'#B9B9B9',textFill=hit?'#FFFFFF':C.ink;
    return `<rect x="${b.x-boxW/2}" y="${b.y-boxH/2}" width="${boxW}" height="${boxH}" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="3"/>
      <text x="${b.x}" y="${b.y+8}" font-size="22" font-weight="700" text-anchor="middle" fill="${textFill}">${esc(b.label)}</text>`;
  }).join('');
  const edgePairs=a.mode==='connector'?[[a.src[0],a.dst[0]]]
    :a.mode==='branch'?a.dst.map(d=>[a.src[0],d])
    :a.mode==='converge'?a.src.map(s=>[s,a.dst[0]])
    :[];
  const lines=edgePairs.map(([f,t])=>{
    const bf=boxes[f],bt=boxes[t];if(!bf||!bt)return '';
    return `<line x1="${bf.x}" y1="${bf.y}" x2="${bt.x}" y2="${bt.y}" stroke="${C.gap}" stroke-width="4" marker-end="url(#chainArrow)"/>`;
  }).join('');
  return {svg:`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="${minX} ${minY} ${vbW} ${vbH}">
    <defs><marker id="chainArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0L10,5L0,10z" fill="${C.gap}"/></marker></defs>
    ${lines}${rects}
  </svg>`,note:null};
}

function svgToPngBlob(svgString,width,height){
  return new Promise((resolve,reject)=>{
    const svgBlob=new Blob([svgString],{type:'image/svg+xml;charset=utf-8'});
    const url=URL.createObjectURL(svgBlob);
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      canvas.width=width;canvas.height=height;
      const ctx=canvas.getContext('2d');
      ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,width,height);
      ctx.drawImage(img,0,0,width,height);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob=>{if(blob)resolve(blob);else reject(new Error('toBlob failed'));},'image/png');
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('SVG failed to rasterize'));};
    img.src=url;
  });
}
function downloadBlob(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

}

// Fork-and-converge model: Land branches into the production path (Measurement -> Production
// -> Revenue) AND directly into AP/JIB. Revenue and AP/JIB are parallel financial streams that
// converge into Close, not a sequence where AP/JIB follows Revenue.
const CHAIN=[
  {id:'land',  label:'Land / Ownership', short:'Land',       domains:['D04'], x:60,  y:200},
  {id:'meas',  label:'Measurement',      short:'Measurement',domains:['D02'], x:300, y:65},
  {id:'prod',  label:'Production',       short:'Production', domains:['D03'], x:300, y:150},
  {id:'rev',   label:'Revenue',          short:'Revenue',    domains:['D05','D06'], x:300, y:235},
  {id:'jib',   label:'AP / JIB',         short:'AP / JIB',   domains:['D07','D08'], x:300, y:320},
  {id:'close', label:'Close',            short:'Close',      domains:['D10'], x:560, y:277},
  {id:'report',label:'Reporting',        short:'Reporting',  domains:['D11'], x:560, y:357},
];
// EDGES documents the fork-and-converge topology (used by chainAnalysis's mode/src/dst logic
// conceptually) even though the full graph is no longer rendered - only the piece relevant to
// a given respondent's largest gap is, via renderOpportunity().
const EDGES=[
  {id:'land-meas', from:'land', to:'meas'},
  {id:'meas-prod', from:'meas', to:'prod'},
  {id:'prod-rev',  from:'prod', to:'rev'},
  {id:'land-jib',  from:'land', to:'jib'},
  {id:'rev-close', from:'rev',  to:'close'},
  {id:'jib-close', from:'jib',  to:'close'},
  {id:'close-report', from:'close', to:'report'},
];
const FOUNDATION={id:'found',label:'Master data and integration',domains:['D01','D12']};
function chainOf(domain){
  if(FOUNDATION.domains.includes(domain))return FOUNDATION.id;
  const s=CHAIN.find(c=>c.domains.includes(domain));
  return s?s.id:null;
}
const UNIVERSAL_ANCHOR={
  '2':'The system supports the work, but people still spend a meaningful amount of time on manual steps and follow-up.',
  '4':'Most of the work moves through the process without manual follow-up, and people focus on the items that need attention.'
};
const STRONG_FOUNDATION={
  id:'PATTERN_NONE_STRONG_FOUNDATION', name:'Strong Operating Foundation',
  practitioner_text:'No major weak spot stands out. The work is well controlled across the areas you assessed, and the next opportunity is to keep reducing manual effort and improve how teams work together.',
  perception_text:'No major weak spot stands out in your answers. The overall picture is strong. A closer review would help confirm that the same strength carries across teams and processes, not just the areas that are working especially well today.'
};

function buildQueue(){
  const role=S.role, all=CONTENT.questions.filter(q=>q.role===role);
  const core=all.filter(q=>q.applicability.mode==='always')
                .sort((a,b)=>a.question_order-b.question_order);
  const q=[...core];
  const structs=all.filter(x=>x.applicability.mode==='structural_slot')
                   .sort((a,b)=>(a.applicability.priority||99)-(b.applicability.priority||99));
  let picked=null;
  for(const s of structs){
    const w=s.applicability.when;
    if(w==='nonop_exposure >= 2'){ if((S.profile.nonop_exposure||0)>=2){picked=s;break;} }
    else if(w==='always'){ if(!picked)picked=s; }
    else if(w==='else'){ if(!picked)picked=s; }
  }
  if(picked)q.push(picked);
  if((S.profile.mna_intensity||0)>=3){
    const m=all.find(x=>x.applicability.mode==='mna_slot');
    if(m)q.push(m);
  }
  S.queue=q;
}

function targetFor(q){
  let t=CONTENT.target_rules.baseline;
  const p=S.profile, mods=q.target_modifiers||[];
  if(['D01','D10','D12'].includes(q.domain_id) && [2,3].includes(p.size_complexity)) t+=1;
  if(mods.includes('NONOP_COMPLEXITY') && (p.nonop_exposure||0)>=2) t+=1;
  if(mods.includes('MNA_INTENSITY') && (p.mna_intensity||0)>=3) t+=1;
  // D13 questions all carry MNA_INTENSITY in target_modifiers already; a separate
  // domain_id==='D13' increment here would double-count the same condition.
  if(q.capability_id==='IT_MASTER_DATA' && (p.mna_intensity||0)>=3) t+=1;
  if(mods.includes('PUBLIC_COMPANY') && S.answers['ctrl_struct_public'] &&
     S.answers['ctrl_struct_public'].value!=='na') t+=1;
  return Math.min(t,CONTENT.target_rules.cap);
}

function scored(){
  return S.queue.filter(q=>{const a=S.answers[q.id];return a&&a.value!=='na';})
                .map(q=>({q,score:Number(S.answers[q.id].value),target:targetFor(q)}));
}
function keyOf(q){return q.type==='handoff'?q.handoff_id:q.capability_id;}
function pick(ids){
  const set=new Set(ids||[]);
  return scored().filter(r=>set.has(keyOf(r.q))).map(r=>r.score);
}
const mx=a=>a.length?Math.max(...a):null, mn=a=>a.length?Math.min(...a):null;
const av=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;

function detect(){
  const rows=scored(); if(!rows.length)return [];
  const all=rows.map(r=>r.score), fired=[];
  const P=id=>CONTENT.patterns.find(p=>p.id===id);
  const add=(id,hi,lo)=>{const p=P(id);if(p)fired.push({pattern:p,spread:hi-lo});};
  const T=(id,k)=>P(id).trigger_inputs[k];
  let hi,lo;

  hi=mx(pick(T('PATTERN_PROCESSING_WITHOUT_ASSURANCE','transaction')));
  lo=mn(pick(T('PATTERN_PROCESSING_WITHOUT_ASSURANCE','assurance')));
  if(hi>=4&&lo<=2)add('PATTERN_PROCESSING_WITHOUT_ASSURANCE',hi,lo);

  hi=mx(pick(T('PATTERN_AUTOMATION_FEEDING_CLEANUP','intake')));
  lo=mn(pick(T('PATTERN_AUTOMATION_FEEDING_CLEANUP','exception')));
  if(hi>=4&&lo<=2)add('PATTERN_AUTOMATION_FEEDING_CLEANUP',hi,lo);

  hi=mx(pick(T('PATTERN_CORRECT_UPSTREAM_BLIND_DOWNSTREAM','source')));
  lo=mn(pick(T('PATTERN_CORRECT_UPSTREAM_BLIND_DOWNSTREAM','handoffs')));
  if(hi>=4&&lo!==null&&lo<=2)add('PATTERN_CORRECT_UPSTREAM_BLIND_DOWNSTREAM',hi,lo);

  const kd=rows.filter(r=>r.q.lens_tags.includes('knowledge_dependency')).map(r=>r.score);
  const ss=rows.filter(r=>(r.q.pattern_signals||[]).includes('spreadsheet_dependency')).map(r=>r.score);
  if(av(all)>=3 && kd.length && av(kd)<=2 && ss.length && mn(ss)<=2)
    add('PATTERN_SPREADSHEET_SHADOW_SYSTEM',av(all),mn(ss));

  lo=mn(pick(T('PATTERN_CLOSE_TIME_DISCOVERY','close')));
  if(av(all)>=3 && lo!==null && lo<=2)add('PATTERN_CLOSE_TIME_DISCOVERY',av(all),lo);

  const ppa=pick(T('PATTERN_PPA_FACTORY','ppa'));
  const rec=pick(T('PATTERN_PPA_FACTORY','reconciliation'));
  const hnd=pick(T('PATTERN_PPA_FACTORY','handoffs'));
  if(ppa.some(v=>v===4) && ((mn(rec)!==null&&mn(rec)<=2)||(mn(hnd)!==null&&mn(hnd)<=2))){
    const low=Math.min(mn(rec)??9,mn(hnd)??9);add('PATTERN_PPA_FACTORY',4,low);
  }

  lo=mn(pick(T('PATTERN_ACQUIRING_FASTER_THAN_ABSORB','readiness')));
  if((S.profile.mna_intensity||0)>=3 && lo!==null && lo<=2)
    add('PATTERN_ACQUIRING_FASTER_THAN_ABSORB',5,lo);

  hi=mx(pick(T('PATTERN_REPORTING_AHEAD_OF_FOUNDATION','reporting')));
  lo=mn(pick(T('PATTERN_REPORTING_AHEAD_OF_FOUNDATION','foundation')));
  if(hi!==null&&hi>=4&&lo!==null&&lo<=2)add('PATTERN_REPORTING_AHEAD_OF_FOUNDATION',hi,lo);

  const order=CONTENT.patterns.map(p=>p.id);
  fired.sort((a,b)=>{
    const A=a.pattern.id==='PATTERN_ACQUIRING_FASTER_THAN_ABSORB',
          B=b.pattern.id==='PATTERN_ACQUIRING_FASTER_THAN_ABSORB';
    if(A!==B)return A?-1:1;
    if(b.spread!==a.spread)return b.spread-a.spread;
    return order.indexOf(a.pattern.id)-order.indexOf(b.pattern.id);
  });
  return fired;
}

function compute(){
  const rows=scored(), perception=S.role==='executive';
  const avg=av(rows.map(r=>r.score))||0;
  const sorted=[...rows].sort((a,b)=>b.score-a.score||a.q.question_order-b.q.question_order);
  const strongest=sorted[0]||null;
  const gaps=rows.map(r=>({...r,gap:r.target-r.score}))
                 .sort((a,b)=>b.gap-a.gap||a.score-b.score);
  const largest=gaps[0]&&gaps[0].gap>0?gaps[0]:null;
  const belowCount=rows.filter(r=>r.score<r.target).length;
  const fired=detect();
  const R=CONTENT.pattern_resolution;
  let headline;
  if(fired.length){
    const p=fired[0].pattern;
    headline={id:p.id,name:p.name,text:perception?p.perception_text:p.practitioner_text,booth:p.booth_line||null};
  }else if(avg>=4 && (!largest || largest.gap<=1)){
    // A high average with one capability sitting two or more levels below target is not
    // a strong-foundation story; it's an isolated gap wearing a good average as camouflage.
    headline={id:STRONG_FOUNDATION.id,name:STRONG_FOUNDATION.name,
      text:perception?STRONG_FOUNDATION.perception_text:STRONG_FOUNDATION.practitioner_text,booth:null};
  }else{
    const fb=avg<2.5?R.low_maturity_fallback:R.no_pattern_fallback;
    headline={id:fb.id,name:fb.name,text:perception?fb.perception_text:fb.practitioner_text,booth:null};
  }
  return {avg:Math.round(avg*10)/10,rows,strongest,largest,belowCount,fired,headline,perception,
          gapTotal:rows.reduce((s,r)=>s+Math.max(0,r.target-r.score),0)};
}

function actions(res){
  const out=[];
  const worst=[...res.rows].map(r=>({...r,gap:r.target-r.score}))
        .sort((a,b)=>b.gap-a.gap||a.score-b.score).filter(r=>r.gap>0).slice(0,3);
  const lead={
    1:phrase=>`Define a consistent process and clear owner for ${phrase}.`,
    2:phrase=>`Reduce manual follow-up in ${phrase} and make the review steps consistent.`,
    3:phrase=>`Add clear checks around ${phrase} so the team can focus on the items that need attention.`,
    4:phrase=>`Track recurring problems in ${phrase} and remove their causes.`
  };
  const when=['Start Here','Next','Then'];
  worst.forEach((r,i)=>{
    const phrase=r.q.action_phrase||shortName(r.q).toLowerCase();
    const build=lead[r.score]||(p=>`Strengthen ${p}.`);
    out.push({when:when[i]||'Next',what:build(phrase)});
  });
  if(!out.length){
    if(res.avg>=4){
      out.push({when:'Start Here',
        what:'Keep the controls that are working, reduce recurring manual work, and improve how teams work together.'});
    }else{
      out.push({when:'Start Here',
        what:'Keep the controls that are working and focus people on the items that actually need attention.'});
    }
  }
  return out;
}

/* handoff-aware chain analysis, topology-accurate to the fork-and-converge model */
function chainAnalysis(res){
  const lg=res.largest;
  if(!lg)return {mode:'none'};
  const q=lg.q;
  if(q.type==='handoff'){
    if(q.handoff_id==='production_to_revenue')
      return {mode:'connector',edges:['prod-rev'],src:['prod'],dst:['rev'],
        label:q.short_label||'Production to Revenue handoff',level:lg.score,target:lg.target};
    if(q.handoff_id==='land_to_revenue_jib')
      return {mode:'branch',edges:['land-rev','land-jib'],src:['land'],dst:['rev','jib'],
        label:q.short_label||'Land to Revenue and JIB handoff',level:lg.score,target:lg.target};
    if(q.handoff_id==='subledger_to_corporate_close')
      return {mode:'converge',edges:['rev-close','jib-close'],src:['rev','jib'],dst:['close'],
        label:q.short_label||'Subledger to Close handoff',level:lg.score,target:lg.target};
  }
  if(q.domain_id==='D13')return {mode:'mna',label:shortName(q),level:lg.score,target:lg.target};
  if(q.domain_id==='CROSS')return {mode:'cross',label:shortName(q),level:lg.score,target:lg.target};
  if(FOUNDATION.domains.includes(q.domain_id))return {mode:'foundation',label:shortName(q),level:lg.score,target:lg.target};
  const stage=chainOf(q.domain_id);
  return {mode:'node',stage,label:shortName(q),level:lg.score,target:lg.target};
}

function renderOrientationMap(res){
  const a=chainAnalysis(res);
  const hitNode=new Set(), hitLine=new Set();
  if(a.mode==='node')hitNode.add(a.stage);
  if(a.mode==='connector'){hitNode.add(a.src[0]);hitNode.add(a.dst[0]);hitLine.add('prod-rev');}
  if(a.mode==='converge'){hitNode.add('rev');hitNode.add('jib');hitNode.add('close');hitLine.add('rev-close');hitLine.add('jib-close');}
  if(a.mode==='branch'){hitNode.add('land');hitNode.add('rev');hitNode.add('jib');hitLine.add('land-rev');hitLine.add('land-jib');}

  const boxesSVG=MAPBOXES.map(b=>{
    const cls=hitNode.has(b.id)?' hit':'';
    return `<rect class="mapbox${cls}" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="5"/>
      <text class="mapboxlabel${cls}" x="${b.x+b.w/2}" y="${b.y+b.h/2+4}" text-anchor="middle">${esc(b.label)}</text>`;
  }).join('');
  const linesSVG=MAPLINES.map(c=>{
    const hit=hitLine.has(c.id);
    return `<line class="mapline${hit?' hit':''}" x1="${c.x1}" y1="${c.y1}" x2="${c.x2}" y2="${c.y2}"
      marker-end="url(#mapArrow${hit?'Hit':''})"/>`;
  }).join('');
  const svg=`<svg viewBox="0 0 520 180" class="omap" role="img" aria-label="Field-to-finance flow map">
    <defs>
      <marker id="mapArrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L8,4L0,8z" fill="#D8D2C6"/></marker>
      <marker id="mapArrowHit" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L8,4L0,8z" fill="#F05B33"/></marker>
    </defs>
    <g>${linesSVG}</g><g>${boxesSVG}</g>
  </svg>`;

  const ribbon=a.mode==='mna'?`<div class="ochain-mna">M&amp;A pressure across the model</div>`
    :a.mode==='cross'?`<div class="ochain-cross">Cross-functional across the model</div>`:'';
  const bar=a.mode==='foundation'?`<div class="ochain-foundation">Master data &amp; integration, underneath every stage</div>`:'';
  return `<div class="ochain-wrap">${ribbon}${svg}${bar}</div>`;
}

function renderOpportunity(res){
  const a=chainAnalysis(res);
  if(a.mode==='none')return `<p>No material gaps against target. Every assessed area meets or exceeds
      what we'd expect for an operation like yours.</p>`;
  const gap=a.target-a.level;
  const gapLine=`${gap} level${gap===1?'':'s'} below target`;

  if(a.mode==='connector'){
    const srcLabel=CHAIN.find(c=>c.id===a.src[0]).label, dstLabel=CHAIN.find(c=>c.id===a.dst[0]).label;
    return `
      <div class="miniflow vertical">
        <div class="mnode">${esc(srcLabel)}</div>
        <div class="marrow">&darr;<span class="mtag">Handoff gap</span></div>
        <div class="mnode hit">${esc(dstLabel)}</div>
      </div>
      <div class="oppnote"><div class="k">${esc(a.label)}</div>
        <p>Currently <b>${esc(lvlName(a.level))}</b>. For an operation like yours, the target is
        <b>${esc(lvlName(a.target))}</b>. ${gapLine}.</p></div>`;
  }
  if(a.mode==='branch'){
    const srcLabel=CHAIN.find(c=>c.id===a.src[0]).label;
    const dstLabels=a.dst.map(id=>CHAIN.find(c=>c.id===id).label);
    return `
      <div class="miniflow branch">
        <div class="mnode src">${esc(srcLabel)}</div>
        <div class="mbranches">${dstLabels.map(l=>`<div class="mbranch">&rarr; ${esc(l)}</div>`).join('')}</div>
      </div>
      <div class="oppnote"><div class="k">${esc(a.label)}</div>
        <p>Ownership changes are not consistently reaching both Revenue and AP/JIB.
        Currently <b>${esc(lvlName(a.level))}</b>, target <b>${esc(lvlName(a.target))}</b>. ${gapLine}.</p></div>`;
  }
  if(a.mode==='converge'){
    const srcLabels=a.src.map(id=>CHAIN.find(c=>c.id===id).label);
    const dstLabel=CHAIN.find(c=>c.id===a.dst[0]).label;
    return `
      <div class="miniflow converge">
        <div class="mconverge-srcs">${srcLabels.map(l=>`<div class="mbranch">${esc(l)} &rarr;</div>`).join('')}</div>
        <div class="mnode hit">${esc(dstLabel)}</div>
      </div>
      <div class="oppnote"><div class="k">${esc(a.label)}</div>
        <p>Revenue and AP/JIB are reaching Close without a strong enough check that the balances agree.
        Currently <b>${esc(lvlName(a.level))}</b>, target <b>${esc(lvlName(a.target))}</b>. ${gapLine}.</p></div>`;
  }
  if(a.mode==='node'){
    const stageLabel=CHAIN.find(c=>c.id===a.stage).label;
    return `<div class="oppnote plain"><div class="k">Largest opportunity sits within ${esc(stageLabel)}</div>
      <p>${esc(a.label)} &middot; ${esc(lvlName(a.level))}, target ${esc(lvlName(a.target))}. ${gapLine}.</p></div>`;
  }
  if(a.mode==='foundation'){
    return `<div class="oppnote plain"><div class="k">This is a foundation issue</div>
      <p>This issue affects the information shared across systems, so it can show up in several parts
      of field-to-finance. ${esc(a.label)} &middot; ${gapLine}.</p></div>`;
  }
  if(a.mode==='cross'){
    return `<div class="oppnote plain"><div class="k">This affects several teams</div>
      <p>This issue affects several parts of field-to-finance instead of one area. ${gapLine}.</p></div>`;
  }
  if(a.mode==='mna'){
    return `<div class="oppnote plain"><div class="k">This acquisition issue affects several teams</div>
      <p>Bringing an acquired asset into the business affects several teams and processes at once.
      ${esc(a.label)} &middot; ${gapLine}.</p></div>`;
  }
  return '';
}

function setSpine(n,total){
  spine.hidden=false;spine.innerHTML='';
  for(let i=0;i<total;i++){
    const b=document.createElement('i');
    if(i<n)b.className='done'; else if(i===n)b.className='now';
    spine.appendChild(b);
  }
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function tick(t){$('ticker').textContent=t||'';}

/* stateful profile navigation: profNav records the indices actually shown */
function showProfile(i){
  const qs=CONTENT.profile_questions;
  while(i<qs.length && qs[i].id==='profile_mix' && S.profile.nonop_exposure===3)i++;
  if(i>=qs.length){buildQueue();return screenQuestion(0);}
  S.profNav.push(i);
  renderProfileScreen(i);
}
function backProfile(){
  S.profNav.pop();
  if(!S.profNav.length){screenRole(false);return;}
  renderProfileScreen(S.profNav[S.profNav.length-1]);
}
function renderProfileScreen(i){
  const qs=CONTENT.profile_questions, q=qs[i];
  setSpine(i,4);tick(`Step ${i+1} of 4`);
  stage.innerHTML=`<div class="qhead"><div class="qmeta"><span class="code">PROFILE</span></div>
    <p class="qprompt">${esc(q.prompt)}</p></div><div class="opts" id="opts"></div>
    <button class="back" id="bk">Back</button>`;
  // Every field ANY option on this question could set or flag is a field derived from this
  // question. Clear all of them before applying the newly chosen option's effects, so
  // re-answering (via Back, then a different pick) can never leave a stale derived value
  // from the option that's no longer selected - e.g. re-picking operation size after having
  // picked "primarily non-operated" must not leave nonop_exposure stuck at 3.
  const derivedFields=new Set();
  q.options.forEach(opt=>{
    if(opt.effects&&opt.effects.set)Object.keys(opt.effects.set).forEach(k=>derivedFields.add(k));
    if(opt.effects&&opt.effects.flag)derivedFields.add(opt.effects.flag);
  });
  q.options.forEach(o=>{
    const b=document.createElement('button');
    b.className='opt plain';b.type='button';
    b.innerHTML=`<span class="olabel">${esc(o.label)}</span>`;
    b.onclick=()=>{
      b.setAttribute('aria-pressed','true');
      derivedFields.forEach(f=>delete S.profile[f]);
      S.profile[q.field]=o.value;
      if(o.effects&&o.effects.set)Object.assign(S.profile,o.effects.set);
      if(o.effects&&o.effects.flag)S.profile[o.effects.flag]=true;
      saveDraft();
      setTimeout(()=>showProfile(i+1),120);
    };
    $('opts').appendChild(b);
  });
  $('bk').onclick=backProfile;
}

function screenQuestion(i){
  if(i>=S.queue.length)return screenSnapshot();
  S.idx=i;
  const q=S.queue[i], n=S.queue.length;
  setSpine(i,n);tick(`Question ${i+1} of ${n}`);
  const dom=q.domain_id==='CROSS'?'Cross-functional':(CONTENT.domains.find(d=>d.domain_id===q.domain_id)||{}).name||'';
  stage.innerHTML=`

  ['1','2','3','4','5'].forEach(l=>{
    const a=q.anchors[l], txt=a.text||UNIVERSAL_ANCHOR[l]||'', b=document.createElement('button');
    b.className='opt';b.type='button';
    b.setAttribute('aria-pressed', S.answers[q.id]&&S.answers[q.id].value===l ? 'true':'false');
    b.innerHTML=`<span class="lvl">${l}</span><span><span class="olabel">${esc(a.label)}</span>${
      txt?`<span class="otext">${esc(txt)}</span>`:''}</span>`;
    b.onclick=()=>{
      b.setAttribute('aria-pressed','true');
      S.answers[q.id]={value:l,ts:Date.now()};saveDraft();
      setTimeout(()=>screenQuestion(i+1),130);
    };
    $('opts').appendChild(b);
  });
  if(q.na_option){
    const b=document.createElement('button');
    b.className='opt na';b.type='button';
    b.innerHTML=`<span class="lvl">N/A</span><span><span class="olabel">This does not apply to us</span></span>`;
    b.onclick=()=>{
      S.answers[q.id]={value:'na',ts:Date.now()};saveDraft();
      setTimeout(()=>screenQuestion(i+1),130);
    };
    $('opts').appendChild(b);
  }
  $('bk').onclick=()=>{
    if(i===0){buildQueue();const top=S.profNav[S.profNav.length-1]??3;renderProfileScreen(top);}
    else screenQuestion(i-1);
  };
}

function persist(contact){
  if(S.saved)return;
  const res=S.result||compute();
  const completed=new Date().toISOString();
  // Enough to rebuild the teaser or report later without recomputing
  // anything: resolved to display values now, at completion time, so what
  // the attendee saw at the booth, what sits in Supabase, and what arrives
  // by email are the same numbers.
  const resultSnapshot={
    maturity:res.avg, maturity_label:lvlName(Math.round(res.avg)), perception:res.perception,
    below_target_count:res.belowCount, assessed_area_count:res.rows.length, gap_total:res.gapTotal,
    primary_pattern:{id:res.headline.id,name:res.headline.name,text:res.headline.text,booth:res.headline.booth||null},
    secondary_patterns:res.fired.slice(1,3).map(f=>({id:f.pattern.id,name:f.pattern.name})),
    largest_opportunity:res.largest?{
      short_label:shortName(res.largest.q),
      current:res.largest.score,current_label:lvlName(res.largest.score),
      target:res.largest.target,target_label:lvlName(res.largest.target),
      gap:res.largest.gap
    }:null,
    chain_analysis:chainAnalysis(res),
    capability_results:res.rows.map(r=>({
      short_label:shortName(r.q),
      current:r.score,current_label:lvlName(r.score),
      target:r.target,target_label:lvlName(r.target),
      gap:r.target-r.score
    })),
    priorities:actions(res),
    role:S.role,profile:S.profile,contact:contact,
    content_version:CONTENT.meta.version,app_version:APP_VERSION,
    instance:instanceId(),response_id:S.response_id,
    started:S.started,completed:completed
  };
  const rec={
    instance:instanceId(),
    started:S.started,completed:completed,
    event:CONTENT.meta.event_id,content_version:CONTENT.meta.version,app_version:APP_VERSION,
    role:S.role,perception:res.perception,profile:S.profile,
    answers:S.queue.map(q=>({id:q.id,capability:q.capability_id,handoff:q.handoff_id,
      domain:q.domain_id,value:(S.answers[q.id]||{}).value||null,target:targetFor(q)})),
    maturity:res.avg,gap_total:res.gapTotal,
    headline_pattern:res.headline.id,
    patterns_fired:res.fired.map(f=>({id:f.pattern.id,spread:Math.round(f.spread*100)/100})),
    contact:contact,email_requested:!!contact,
    response_id:S.response_id,
    result_snapshot:resultSnapshot
  };
  S.saved=true;saveOne(rec);clearDraft();
  // persist() clears the draft, so an offline completion needs its retry
  // payload held somewhere that survives - that's pending_completion.
  if(S.response_id){
    upsertSync(S.response_id,{
      pending_completion:{contact:contact,result_snapshot:resultSnapshot,completed_at:completed},
      sync_status:'pending'
    });
    syncComplete(S.response_id);
  }
}

// Compact quick-view heatmap: one small tile per scored area, sorted worst-gap-first, colored
// by how far current sits from target. Sits above the detailed rows as a 2-second scan layer;
// the detailed rows below it are where someone actually reads the specifics.
function capabilityHeatmapHTML(res){
  if(!res.rows.length)return '';
  const tiles=[...res.rows]
    .sort((a,b)=>(b.target-b.score)-(a.target-a.score)||a.score-b.score)
    .map(r=>{
      const gap=r.target-r.score;
      const cls=gap>=2?'below-major':gap===1?'below-minor':gap===0?'at':'above';
      return `<div class="capheat-tile ${cls}"><div class="chswatch">${r.score}</div>
        <div class="chlabel">${esc(shortName(r.q))}</div></div>`;
    }).join('');
  return `<div class="capheat">
    <h3>Quick view of your assessed areas</h3>
    <p class="capheat-legend-line">Number = your current maturity level. Color = how it compares with your target.</p>
    <div class="capheat-row">${tiles}</div>
    <div class="legend">
      <b><span class="swatch" style="background:var(--gap)"></span>Materially below</b>
      <b><span class="swatch" style="background:var(--target)"></span>Slightly below</b>
      <b><span class="swatch" style="background:var(--strong)"></span>At target</b>
      <b><span class="swatch" style="background:var(--info)"></span>Above target</b>
    </div>
  </div>`;
}

function capabilityRowHTML(r){
  const state=r.score<r.target?'below':r.score>r.target?'above':'at';
  const diff=Math.abs(r.target-r.score);
  if(state==='below'){
    return `<div class="row below">
      <div class="rowhead"><span class="nm">${esc(shortName(r.q))}</span>
        <span class="lvlname">${esc(lvlName(r.score))}</span></div>
      <div class="bar"><i style="width:${r.score/5*100}%"></i><u style="left:calc(${r.target/5*100}% - 1px)"></u></div>
      <div class="status">${diff} level${diff===1?'':'s'} below target
        <span class="tgt">&middot; Target: ${esc(lvlName(r.target))}</span></div>
    </div>`;
  }
  const statusinline=state==='at'?'&#10003; At target':`&#8593; ${diff} level${diff===1?'':'s'} above target`;
  return `<div class="row ${state}">
    <span class="nm">${esc(shortName(r.q))}</span>
    <span class="lvlname">${esc(lvlName(r.score))}</span>
    <span class="statusinline">${statusinline}</span>
  </div>`;
}

function screenFull(){
  const res=S.result,h=res.headline;
  tick('Full assessment');
  const rowsHTML=[...res.rows]
    .sort((a,b)=>(b.target-b.score)-(a.target-a.score)||a.score-b.score)
    .map(capabilityRowHTML).join('');
  const acts=actions(res).map(a=>`<li><span class="when">${esc(a.when)}</span><span class="what">${esc(a.what)}</span></li>`).join('');
  const others=res.fired.slice(1,3).map(f=>f.pattern.name);
  const hasGap=!!res.largest;
  const f2fHeading=hasGap?'Where the opportunity sits':'How your result maps';
  const f2fLede=hasGap
    ?'This shows where your biggest maturity gap sits in the field-to-finance model.'
    :'Your assessed areas meet or exceed target. This shows how those strengths map across the field-to-finance model.';
  const fwdNavText=hasGap?'View where the gaps sit':'View how your result maps';

  const panels=[
    {label:'Your Result', html:`
      ${heroHTML(res)}
      <div class="patterncard">
        <div class="k">What your answers point to</div>
        <h2>${esc(h.name)}</h2>
        <p>${esc(h.text)}</p>
      </div>
      <div class="scoreline">${scoreLabel(res)}: ${res.avg.toFixed(1)} / 5</div>
      ${others.length?`<p style="font-size:14px;margin-top:16px"><b>Also showing:</b> ${esc(others.join(', '))}.
        Worth a longer conversation than a booth allows.</p>`:''}
      <div class="fwdnav"><button data-goto="1">${esc(fwdNavText)} &#8594;</button></div>`},
    {label:'Field-to-Finance', html:`
      <h3>${esc(f2fHeading)}</h3>
      <p class="opplede">${esc(f2fLede)}</p>
      ${renderOrientationMap(res)}
      <div class="chainwrap">${renderOpportunity(res)}</div>
      ${capabilityHeatmapHTML(res)}
      <h3 style="margin-top:26px">Your maturity profile</h3>
      <p class="readme">Your responses are compared with the maturity level appropriate for an operation
      with your size, complexity and operating profile. The bar shows your current maturity; the marker
      shows your target. Areas below target are shown first.</p>
      <div class="heat">${rowsHTML}</div>
      <div class="legend">
        <b><span class="swatch" style="background:var(--gap)"></span>Below target</b>
        <b><span class="swatch" style="background:var(--target);width:3px;height:10px"></span>Target for an operation like yours</b>
      </div>
      <div class="fwdnav"><button data-goto="2">See where to start &#8594;</button></div>`},
    {label:'Priorities', html:`
      <h3>Where we would start</h3>
      <ul class="actionlist">${acts}</ul>
      <div class="bridge">
        <div class="k">The deeper version</div>
        <p>Ask us about a deeper review where we check these answers against your actual processes,
        reports, reconciliations, and examples of how issues are handled.</p>
      </div>
      <div class="actions" style="margin-top:26px">
        <button class="btn" id="done">Done</button>
      </div>`},
  ];

  stage.innerHTML=`
    <div class="disclaimer">Self-assessed, not independently verified &middot; ${res.perception?'Executive responses':'Practitioner responses'}</div>
    <div class="tabstrip" id="tabstrip">
      ${panels.map((p,i)=>`<button class="tab${i===0?' active':''}" data-i="${i}">${esc(p.label)}</button>`).join('')}
    </div>
    ${panels.map((p,i)=>`<div class="tabpanel${i===0?' active':''}" data-panel="${i}">${p.html}</div>`).join('')}`;
  $('done').onclick=screenThanks;
  function switchTab(i){
    $('tabstrip').querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    stage.querySelectorAll('.tabpanel').forEach(x=>x.classList.remove('active'));
    $('tabstrip').querySelector(`.tab[data-i="${i}"]`).classList.add('active');
    stage.querySelector(`.tabpanel[data-panel="${i}"]`).classList.add('active');
  }
  $('tabstrip').querySelectorAll('.tab').forEach(t=>{t.onclick=()=>switchTab(t.dataset.i);});
  stage.querySelectorAll('[data-goto]').forEach(b=>{b.onclick=()=>switchTab(b.dataset.goto);});
  $('resetBtn').hidden=false;
}

// The Enertia Conference Pulse is reserved for phase 2: it needs a shared backend to mean
// what it claims ("N operators assessed at this event"). A per-device localStorage count can
// overstate reach (one operator, several employees) and can't see the other booth device at
// all. Nothing renders here until there's a real aggregate to report.

function screenThanks(){
  spine.hidden=true;tick('');
  const roleLabel=(CONTENT.profile_questions[0].options.find(o=>o.value===S.role)||{}).label||'';
  stage.innerHTML=`
    <h1>Thanks.</h1>
    <p class="lede">We'll follow up with your full diagnostic.</p>
    <div class="actions">
      <button class="btn" id="samerole">Next person, same role (${esc(roleLabel)})</button>
      <button class="btn ghost" id="diffrole">Different role</button>
    </div>`;
  $('samerole').onclick=()=>{
    fresh(true);
    // screenRole() is skipped on this path (role is preserved), so this is
    // the equivalent "first meaningful action" moment for a new respondent.
    beginRespondent();
    showProfile(1);
  };
  $('diffrole').onclick=()=>{fresh(false);screenRole(false);};
}

function screenAdminGate(){
  spine.hidden=true;tick('Booth admin');
  stage.innerHTML=`
    <h2>Booth admin</h2>
    <p>Enter the admin PIN to continue.</p>
    <div class="field"><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="8"></div>
    <div class="err" id="perr"></div>
    <div class="actions">
      <button class="btn" id="pgo">Continue</button>
      <button class="btn ghost" id="pback">Back to start</button>
    </div>`;
  $('pgo').onclick=()=>{
    if($('pin').value===ADMIN_PIN)screenAdmin();
    else{$('perr').textContent='Incorrect PIN.';$('pin').focus();}
  };
  $('pin').onkeydown=e=>{if(e.key==='Enter')$('pgo').click();};
  $('pback').onclick=screenWelcome;
}
function maskEmail(e){
  if(!e)return '-';
  const parts=e.split('@');
  if(parts.length!==2)return '***';
  return parts[0].slice(0,1)+'***@'+parts[1];
}
function screenAdmin(){
  const all=readAll();
  spine.hidden=true;tick('Booth admin');
  stage.innerHTML=`
    <h2 class="admin">Booth admin</h2>
    ${storageOK?'':`<div class="warn">This device is not saving to browser storage, so results
      only exist in memory and will be lost on refresh. Export now and open the file from a normal
      browser tab rather than a preview pane.</div>`}
    <p>Instance <b>${esc(instanceId())}</b> &middot; ${all.length} completed
    ${all.length===1?'assessment':'assessments'} &middot; content v${esc(CONTENT.meta.version)} &middot; app v${esc(APP_VERSION)}</p>
    <div class="actions">
      <button class="btn small" id="csv">Export CSV</button>
      <button class="btn small ghost" id="json">Export JSON</button>
      <button class="btn small ghost" id="reports">Conference reports</button>
      <button class="btn small ghost" id="close">Back to start</button>
      <button class="btn small ghost" id="wipe" style="color:var(--gap);border-color:var(--gap)">Clear this device</button>
    </div>
    <div class="scroll admin" style="margin-top:18px">${all.length?table(all):'<p>No responses yet.</p>'}</div>`;
  $('csv').onclick=()=>download(csv(all),'weaver-diagnostic-'+instanceId()+'.csv','text/csv');
  $('json').onclick=()=>download(JSON.stringify(all,null,2),'weaver-diagnostic-'+instanceId()+'.json','application/json');
  $('reports').onclick=screenReportsGate;
  $('close').onclick=screenWelcome;
  $('wipe').onclick=()=>{
    const v=prompt('Type DELETE to permanently remove all responses stored on this device. Responses already synced to the conference database are retained there.');
    if(v==='DELETE'){try{localStorage.removeItem(KEY);}catch(e){}memStore=[];screenAdmin();}
  };
}
function table(all){
  const head=['completed','role','maturity','gap','pattern','email'];
  return `<table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>`+
    all.slice().reverse().map(r=>`<tr>
      <td>${esc(r.completed.slice(5,16).replace('T',' '))}</td>
      <td>${esc(r.role.replace(/_/g,' '))}</td>
      <td>${r.maturity}</td><td>${r.gap_total}</td>
      <td>${esc((r.headline_pattern||'').replace('PATTERN_','').toLowerCase().replace(/_/g,' '))}</td>
      <td>${r.contact?esc(maskEmail(r.contact.email)):'-'}</td></tr>`).join('')+'</tbody></table>';
}
function csv(all){
  const cols=['instance','completed','event','content_version','app_version','role','perception','maturity','gap_total',
    'headline_pattern','size_complexity','nonop_exposure','mna_intensity','name','company','email','answers'];
  const esc2=v=>{const s=v==null?'':String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const lines=[cols.join(',')];
  all.forEach(r=>lines.push(cols.map(c=>{
    if(c==='name')return esc2(r.contact&&r.contact.name);
    if(c==='company')return esc2(r.contact&&r.contact.company);
    if(c==='email')return esc2(r.contact&&r.contact.email);
    if(['size_complexity','nonop_exposure','mna_intensity'].includes(c))return esc2(r.profile[c]);
    if(c==='answers')return esc2(r.answers.map(a=>`${a.id}=${a.value}/${a.target}`).join(' '));
    return esc2(r[c]);
  }).join(',')));
  return lines.join('\n');
}
function download(text,name,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

$('resetBtn').onclick=()=>{if(confirm('Clear this session and start over for the next person?')){clearDraft();screenWelcome();}};
let taps=0,tapTimer=null;
$('adminBtn').onclick=()=>{
  taps++;clearTimeout(tapTimer);tapTimer=setTimeout(()=>taps=0,1200);
  if(taps>=3){taps=0;screenAdminGate();}
};
$('foot').textContent='Field-to-Finance Maturity Framework  \u00B7  '+instanceId();

if(location.search.includes('admin')){screenAdminGate();}
else{
  const draft=readDraft();
  if(draft)screenResume(draft);else screenWelcome();
}

// Flush pending writes: on startup, on reconnect, on tab foregrounding, and
// on teardown (keepalive fetch so an offline completion still leaves).
// Deliberately not gated on navigator.onLine anywhere in this file.
flushPending();
window.addEventListener('online',flushPending);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')flushPending();});
window.addEventListener('pagehide',flushPendingOnTeardown);
</script>
